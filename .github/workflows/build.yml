# Raaj Draw: build the Windows installer and the Linux AppImage.
# Runs on every push to main (builds only), on version tags (v1.4.4-raaj1, …) and by hand from the Actions tab.
# A tag build also publishes a GitHub Release, which draw.raajsoftware.com/download/* links to.

name: Build Raaj Draw

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # Inkscape's prebuilt MSYS2 build environment (same as its own CI for 1.4.4; see .gitlab-ci.yml)
      IDW_VERSION: "168"
      CCACHE_DIR: ${{ github.workspace }}\ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build environment
        shell: pwsh
        run: |
          $name = "ink$env:IDW_VERSION"
          Invoke-WebRequest "https://gitlab.com/api/v4/projects/46863172/packages/generic/windows/r$env:IDW_VERSION/$name.7z" -OutFile "$name.7z"
          7z x -oC:/ "$name.7z" | Out-Null
          Remove-Item "$name.7z"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Brand the translations (po/ is Inkscape's submodule)
        shell: pwsh
        run: python raaj/rebrand.py --translations

      # Compiler cache, also kept when the build fails so a retry continues where it stopped.
      - uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      - name: Configure
        shell: pwsh
        run: |
          & "C:/ink$env:IDW_VERSION/msys2_shell.cmd" -defterm -no-start -ucrt64 -use-full-path -here -c `
            "set -o pipefail; cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log"
          if ($LASTEXITCODE -ne 0) { python raaj/ci-report.py configure.log; exit 1 }

      - name: Build installer (.exe) and portable archive (.7z)
        shell: pwsh
        run: |
          & "C:/ink$env:IDW_VERSION/msys2_shell.cmd" -defterm -no-start -ucrt64 -use-full-path -here -c `
            "set -o pipefail; ninja -C build dist-win-exe dist-win-7z 2>&1 | tee build.log"
          if ($LASTEXITCODE -ne 0) { python raaj/ci-report.py build.log; exit 1 }
          Get-ChildItem build -Filter "raajdraw*" | Format-Table Name, Length

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ccache
          key: ccache-windows-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: raajdraw-windows
          path: |
            build/raajdraw*.exe
            build/raajdraw*.7z
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      # Inkscape's CI image for AppImages (Ubuntu 20.04, so the AppImage runs on older systems)
      image: registry.gitlab.com/inkscape/inkscape-ci-docker/ubuntu-2004
      options: --privileged
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and libcurl
        run: |
          apt-get update
          apt-get install -y git libcurl4-openssl-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Build AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 raaj/rebrand.py --translations
          set -o pipefail
          if ! bash -ex packaging/appimage/generate.sh 2>&1 | tee build.log; then
            python3 raaj/ci-report.py build.log
            exit 1
          fi
          ls -l *.AppImage* || { python3 raaj/ci-report.py build.log; exit 1; }

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ccache
          key: ccache-linux-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: raajdraw-linux
          path: Raaj_Draw*.AppImage*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Raaj Draw ${{ github.ref_name }}
          files: dist/*
          body: |
            Raaj Draw for Windows (installer or portable .7z) and Linux (AppImage).
            Sign in with your Raaj Software account when it starts; new accounts get a free 15-minute demo.
            Raaj Draw is based on Inkscape 1.4.4 and is free software under the GNU GPL; the full source is in this repository.
